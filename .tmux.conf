set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @plugin 'dracula/tmux'
set -g @dracula-show-left-icon 🐶
set -g @dracula-plugins "battery time"
set -g @dracula-time-format "%a %b %d %H:%M"
set -g @dracula-git-no-repo-message "🔧"
set -g @dracula-battery-label false
set -g status-justify left

set -s default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set-window-option -g mode-keys vi
set -g history-limit 40960
set -g allow-rename off
set -g set-titles off
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set-window-option -g monitor-activity off
set -g bell-action none
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u

set -g prefix C-a
unbind C-b
bind C-a last-window
bind a send-prefix

bind r source-file ~/.config/tmux/tmux.conf

bind n next-window
bind p previous-window

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vi copy-mode: v begin, y copy to macOS clipboard, mouse-drag copies
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

run '~/.config/tmux/plugins/tpm/tpm'

# fill the whole prompt line so stale status chars don't show through (tmux/tmux#5328)
set -g message-style "bg=#44475a,fg=#f8f8f2,fill=#44475a"
set -g message-command-style "bg=#44475a,fg=#f8f8f2,fill=#44475a"

# interactive prompts via popup (avoid status-line overlap bug tmux/tmux#5328)
unbind ,
bind , display-popup -E -w 40 -h 3 "sh -c 'printf \"rename-window: \"; read n && [ -n \"\$n\" ] && tmux rename-window \"\$n\"'"

unbind '$'
bind '$' display-popup -E -w 40 -h 3 "sh -c 'printf \"rename-session: \"; read n && [ -n \"\$n\" ] && tmux rename-session \"\$n\"'"

# general command prompt: fuzzy-pick a tmux command, then supply args
unbind :
bind : display-popup -E -w 70% -h 60% "sh ~/.config/tmux/scripts/cmd-fzf.sh"
